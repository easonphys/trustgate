[project]
name = "trustgate"
version = "0.1.0"
description = "Agent identity, attenuated delegation, and audit for MCP/A2A"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TrustGate" }]
keywords = ["agent", "mcp", "a2a", "identity", "delegation", "authorization"]
dependencies = [
  "cryptography>=43.0.0",
  "pyjwt>=2.9.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
  "starlette>=0.38.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
trustgate = "trustgate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustgate"]

[tool.hatch.build.targets.sdist]
include = ["src/trustgate", "tests", "examples", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
